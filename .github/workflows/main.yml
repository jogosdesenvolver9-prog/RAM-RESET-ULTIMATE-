name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rodar testes unitários
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK gerado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado em $APK"
            exit 1
          fi
          echo "APK gerado:"
          ls -lh "$APK"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RamResetUltimate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
